# Colectare automată: firme noi (ONRC) + date ANAF (telefon, adresă, CAEN, TVA).
#
# Rulează DOAR într-un repository PRIVAT (rezultatele conțin date de contact).
# Pornește: zilnic, manual (Actions → Run workflow) sau la modificarea
# fișierului `rulare.txt`. Rezultatele (Excel + CSV) apar:
#   - în branch-ul `rezultate` al repository-ului (ultima rulare);
#   - ca fișier descărcabil („Artifacts") în pagina rulării.
# Baza de date se păstrează între rulări, deci rularea zilnică interoghează
# ANAF doar pentru firmele nou apărute.

name: Colectare firme noi

on:
  workflow_dispatch:
    inputs:
      dupa:
        description: "Firme înmatriculate după data (YYYY-MM-DD). Gol = 1 ianuarie anul curent."
        required: false
        default: ""
      limit:
        description: "Limită firme la ANAF (gol = toate; ex. 300 pentru un test rapid)"
        required: false
        default: ""
      sursa:
        description: "Sursa listei: anaf_scan (merge de pe GitHub) sau onrc (data.gov.ro, doar din România)"
        required: false
        default: "anaf_scan"
      max_batches:
        description: "anaf_scan: loturi de 100 CUI pe tranșă (restul continuă automat în rularea următoare)"
        required: false
        default: "1200"
  schedule:
    - cron: "23 4 * * *"   # zilnic, ~07:23 ora României
  push:
    paths: ["rulare.txt"]

permissions:
  contents: write
  actions: write   # pentru pornirea automată a tranșei următoare

concurrency:
  group: colectare-firme
  cancel-in-progress: false

jobs:
  colectare:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Verificare repository privat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          privat="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          if [ "$privat" != "true" ]; then
            echo "::error::Repository-ul este public. Rezultatele conțin date de contact; rulează workflow-ul doar într-un repository privat."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalare
        run: pip install -r requirements.txt

      - name: Parametri
        run: |
          DUPA="${{ inputs.dupa }}"
          [ -z "$DUPA" ] && DUPA="$(date -u +%Y)-01-01"
          echo "DUPA=$DUPA" >> "$GITHUB_ENV"
          SURSA="${{ inputs.sursa }}"
          [ -z "$SURSA" ] && SURSA="anaf_scan"
          echo "SURSA=$SURSA" >> "$GITHUB_ENV"
          MAX_BATCHES="${{ inputs.max_batches }}"
          [ -z "$MAX_BATCHES" ] && MAX_BATCHES="1200"
          echo "MAX_BATCHES=$MAX_BATCHES" >> "$GITHUB_ENV"
          echo "LIMIT=${{ inputs.limit }}" >> "$GITHUB_ENV"
          echo "AN=${DUPA:0:4}" >> "$GITHUB_ENV"

      - name: Restaurare bază de date
        uses: actions/cache/restore@v4
        with:
          path: data/firme.db
          key: firme-db-${{ github.run_id }}
          restore-keys: firme-db-

      - name: Verificare acces ANAF
        run: |
          if [ "$SURSA" = "anaf_scan" ]; then python run.py probe --doar-anaf; else python run.py probe; fi

      - name: Colectare firme noi
        run: |
          if [ "$SURSA" = "anaf_scan" ]; then
            python run.py collect --source anaf_scan --dupa "$DUPA" --max-batches "$MAX_BATCHES"
          else
            python run.py collect --source "$SURSA" --dupa "$DUPA"
          fi

      - name: Îmbogățire ANAF (telefon, adresă, CAEN, TVA)
        run: |
          if [ -n "$LIMIT" ]; then python run.py enrich --limit "$LIMIT"; else python run.py enrich; fi

      - name: Salvare bază de date
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/firme.db
          key: firme-db-${{ github.run_id }}

      - name: Statistici
        run: python run.py stats

      - name: Export Excel + CSV
        run: |
          mkdir -p out
          # Firme noi active (fără sedii secundare, PFA, profesii liberale, radiate)
          python run.py export --format xlsx --doar-firme --dupa "$DUPA" --out "out/Firme-noi-$AN.xlsx"
          python run.py export --format xlsx --doar-firme --dupa "$DUPA" --with-phone --fara-suspecte \
            --out "out/Firme-noi-$AN-cu-telefon.xlsx"
          # Toate înregistrările (inclusiv sedii secundare, PFA), cu coloana „tip_entitate"
          python run.py export --dupa "$DUPA" --out "out/Toate-inregistrarile-$AN.csv"
          python run.py stats > out/STATISTICI.txt

      - name: Rezultate (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: firme-noi-${{ env.AN }}
          path: out/
          retention-days: 30

      - name: Rezultate (branch privat „rezultate")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$(mktemp -d)"
          cp "out/Firme-noi-$AN.xlsx" "out/Firme-noi-$AN-cu-telefon.xlsx" out/STATISTICI.txt "$d/"
          gzip -c "out/Toate-inregistrarile-$AN.csv" > "$d/Toate-inregistrarile-$AN.csv.gz"
          cd "$d"
          git init -q -b rezultate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Rezultate $(date -u +%F) – rulare ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rezultate

      - name: Continuă automat (dacă scanarea nu s-a terminat)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat data/scan_status.txt 2>/dev/null)" = "partial" ]; then
            echo "Scanare parțială: pornesc tranșa următoare."
            gh workflow run colectare.yml --ref "${GITHUB_REF_NAME}" \
              -f dupa="$DUPA" -f sursa="$SURSA" -f max_batches="$MAX_BATCHES"
          else
            echo "Scanare completă."
          fi
